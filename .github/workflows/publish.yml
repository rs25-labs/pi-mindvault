name: Publish to npm (trusted publisher, no tokens)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: allows setup-node to mint a short-lived npm token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm publish --access public --provenance
